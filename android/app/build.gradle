plugins {
    id 'com.android.application'
}

// Native libraries are built separately via the engine's waf build
// (see scripts/build-android-aarch64.sh), not through Gradle's own
// CMake/ndk-build integration. This task copies the resulting .so files
// into the jniLibs source set before packaging.
def engineBuildDir = file("${rootDir}/../build")
def vendoredLibsDir = file("${rootDir}/../prebuilt/android/aarch64")
def thirdPartyLibsDir = file("${rootDir}/../lib/android/aarch64")
def jniLibsDir = file("${projectDir}/src/main/jniLibs/arm64-v8a")

tasks.register('copyEngineLibs', Copy) {
    from(engineBuildDir) {
        include '**/*.so'
    }
    from(vendoredLibsDir) {
        include '*.so' // e.g. libopenxr_loader.so - prebuilt deps not produced by waf
    }
    from(thirdPartyLibsDir) {
        include '*.so' // e.g. libSDL2.so - prebuilt runtime deps the engine dynamically links against
    }
    eachFile { it.path = it.name } // flatten into a single directory
    includeEmptyDirs = false
    into jniLibsDir
    doFirst {
        if (!engineBuildDir.exists()) {
            throw new GradleException(
                "Engine build output not found at ${engineBuildDir}. " +
                "Run scripts/build-android-aarch64.sh first."
            )
        }
    }
}

dependencies {
    // Khronos' official prebuilt OpenXR loader (arm64-v8a .so + Java bindings).
    // extractOpenXRLoader below pulls the .so out of this AAR so the engine's
    // waf-built native code can link against it directly.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.42'
}

android {
    namespace 'org.hl2vr.game'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "org.hl2vr.game"
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName "0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn 'copyEngineLibs'
    }
}
