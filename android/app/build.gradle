plugins {
    id 'com.android.application'
}

// Native libraries are built separately via the engine's waf build
// (see scripts/build-android-aarch64.sh), not through Gradle's own
// CMake/ndk-build integration. This task copies the resulting .so files
// into the jniLibs source set before packaging.
def engineBuildDir = file("${rootDir}/../build")
def jniLibsDir = file("${projectDir}/src/main/jniLibs/arm64-v8a")

tasks.register('copyEngineLibs', Copy) {
    from(engineBuildDir) {
        include '**/*.so'
        eachFile { it.path = it.name } // flatten into a single directory
        includeEmptyDirs = false
    }
    into jniLibsDir
    doFirst {
        if (!engineBuildDir.exists()) {
            throw new GradleException(
                "Engine build output not found at ${engineBuildDir}. " +
                "Run scripts/build-android-aarch64.sh first."
            )
        }
    }
}

android {
    namespace 'org.hl2vr.game'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "org.hl2vr.game"
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName "0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn 'copyEngineLibs'
    }
}
